[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arqueo_cid"
version = "1.0.0"
description = "Arqueo Cid – Plataforma de teledetección LiDAR para arqueología"
authors = [
    { name = "David Peña Fernández", email = "david.pena@uco.es" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.9,<3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Dependencias principales (obligatorias para el funcionamiento básico)
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "torch>=2.0",
    "laspy>=2.0",
    "pillow>=9.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "scipy>=1.10",
    "scikit-image>=0.19",
    "pytorch-msssim",
    "scikit-learn>=1.1",
    "psutil>=5.9",
]

# Dependencias opcionales (requieren instalación separada)
[project.optional-dependencies]
gdal = ["gdal>=3.4"]          # Para aceleración de hillshade/slope
torchvision = ["torchvision>=0.13"]  # Para transformaciones adicionales (no usado por defecto)

# Enlaces del proyecto
[project.urls]
Homepage = "https://github.com/dpena/arqueo_cid"
Repository = "https://github.com/dpena/arqueo_cid"
Issues = "https://github.com/dpena/arqueo_cid/issues"

# Configuración de inclusión de paquetes
[tool.setuptools.packages.find]
where = ["."]
include = ["arqueo_cid", "arqueo_cid.*"]
exclude = ["tests", "docs"]

# Datos adicionales que deben empaquetarse (recursos, iconos, mallas)
[tool.setuptools.package-data]
arqueo_cid = ["resources/**/*", "metadata.txt"]

# Configuración opcional para ruff (linter rápido)
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C4", "SIM"]
ignore = ["E501", "UP007"]

# Configuración para mypy (tipado estático opcional)
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_defs = false